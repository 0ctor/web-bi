# Exemplo de compose no host sp1 (`/home/ubuntu/octor/apps/web-bi/`).
# Ainda não registrado. Host pretendido: bi.octor.com.br
#
# name: web-bi
services:
  web:
    image: ${IMAGE:-ghcr.io/0ctor/web-bi:latest}
    container_name: octor-web-bi
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      OCTOR_SERVICE_NAME: web-bi
      AUTH_SECRET: ${AUTH_SECRET:?}
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: https://bi.octor.com.br
    networks:
      - proxy
      - octor
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.web-bi.rule=Host(`bi.octor.com.br`)
      - traefik.http.routers.web-bi.entrypoints=websecure
      - traefik.http.routers.web-bi.tls.certresolver=letsencrypt
      - traefik.http.routers.web-bi.priority=10
      - traefik.http.services.web-bi.loadbalancer.server.port=3000
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
  octor:
    external: true
